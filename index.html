<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Clean Detail Tiles</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQOKjlf2glNCnYL9Su8y5Y7dDXQo4B="
    crossorigin=""
  >
  <style>
    html,
    body,
    #map {
      height: 100%;
      margin: 0;
    }

    .info {
      background: #fff;
      border: 1px solid #bbb;
      color: #222;
      font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 380px;
      padding: 10px 12px;
    }

    .info code {
      background: #f2f2f2;
      padding: 1px 4px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const bounds = L.latLngBounds(
      [48.98985, -115.75681],
      [50.55049, -114.40327]
    );

    const map = L.map("map", {
      maxBounds: bounds.pad(0.5),
      maxBoundsViscosity: 0.2
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const tileUrl = new URL("./tiles/{z}/{x}/{y}.png", window.location.href).href;
    L.tileLayer(tileUrl, {
      minZoom: 13,
      maxZoom: 17,
      maxNativeZoom: 17,
      bounds,
      opacity: 1,
      attribution: "Work Clean Detail"
    }).addTo(map);

    map.fitBounds(bounds);

    const info = L.control({ position: "topright" });
    info.onAdd = () => {
      const div = L.DomUtil.create("div", "info");
      div.innerHTML = `
        <strong>Gaia URL template</strong><br>
        <code>${tileUrl}</code><br><br>
        Zooms: 13-17
      `;
      return div;
    };
    info.addTo(map);
  </script>
</body>
</html>
